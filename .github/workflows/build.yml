name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write          # only used by the release step on tags

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: package
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console ^
            --name BiliRerank ^
            --exclude-module tkinter --exclude-module PyQt5 --exclude-module PyQt6 ^
            --exclude-module PySide6 --exclude-module PyQt-SiliconUI --exclude-module siui ^
            --exclude-module numpy --exclude-module PIL --exclude-module matplotlib ^
            main.py
        shell: cmd

      - name: smoke test
        run: |
          if not exist dist\BiliRerank.exe exit /b 1
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: BiliRerank-windows
          path: dist/BiliRerank.exe

      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BiliRerank.exe
