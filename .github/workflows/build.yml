name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write          # only used by the release step on tags

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -m pip install "git+https://github.com/ChinaIceF/PyQt-SiliconUI"

      - name: package
        run: |
          python -c "from src.ui.icon import render; render('icon.ico')"
          python -m PyInstaller --noconfirm --clean --onefile --windowed ^
            --name BiliHook --icon icon.ico ^
            --collect-data siui ^
            --add-data "src\assets\scripts;src\assets\scripts" ^
            --exclude-module tkinter --exclude-module PyQt6 --exclude-module PySide6 ^
            --exclude-module pygame ^
            main.py
        shell: cmd

      - name: smoke test
        run: |
          if not exist dist\BiliHook.exe exit /b 1
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: BiliHook-windows
          path: dist/BiliHook.exe

      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BiliHook.exe
